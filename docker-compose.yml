name: easi

# Rootless podman: run containers standalone (not in a shared pod) so the dev container
# overlay can use per-container userns_mode: keep-id. Ignored by Docker Compose.
x-podman:
  in_pod: false

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-easi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easi}
      POSTGRES_DB: ${POSTGRES_DB:-easi}
    volumes:
      - easi_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easi"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - easi-network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    environment:
      DB_ADMIN_CONN_STRING: ${DB_ADMIN_CONN_STRING:-host=postgres port=5432 user=easi password=easi dbname=easi sslmode=disable}
      EASI_APP_PASSWORD: ${EASI_APP_PASSWORD:-localdev}
      EASI_ADMIN_PASSWORD: ${EASI_ADMIN_PASSWORD:-localdev}
    networks:
      - easi-network
    depends_on:
      postgres:
        condition: service_healthy

  dex:
    image: docker.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.docker.yaml"]
    volumes:
      - ./dex-config.yaml:/etc/dex/config.docker.yaml
    ports:
      - "5556:5556"
    networks:
      - easi-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_BUILD_TAGS: ${GO_BUILD_TAGS:-devauth}
    restart: unless-stopped
    environment:
      DB_CONN_STRING: host=postgres port=5432 user=easi_app password=localdev dbname=easi sslmode=disable
      AUTH_MODE: ${AUTH_MODE:-local_oidc}
      PORT: 8080
      PLATFORM_ADMIN_API_KEY: ${PLATFORM_ADMIN_API_KEY:-localdev}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-easi-test-secret}
      OIDC_REDIRECT_URL: http://localhost:8080/api/v1/auth/callback
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:5173/
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-105b52c2af25870943e36ded5a7ca51927715ca4bae962b9c72b9268b4ccb43a}
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:-easi-local-agent-token-secret-do-not-use-in-production}
    ports:
      - "8080:8080"
    networks:
      - easi-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8080
        VITE_BUILD_MODE: development
    ports:
      - "5173:8080"
    networks:
      - easi-network

  pgadmin:
    image: docker.io/dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@easi.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - easi_pgadmin_data:/var/lib/pgadmin
    configs:
      - source: pgadmin_servers
        target: /pgadmin4/servers.json
    ports:
      - "5050:80"
    networks:
      - easi-network
    depends_on:
      - postgres

volumes:
  easi_postgres_data:
  easi_pgadmin_data:

networks:
  easi-network:
    driver: bridge

configs:
  pgadmin_servers:
    content: |
      {
        "Servers": {
          "1": {
            "Name": "easi-postgres",
            "Group": "Servers",
            "Host": "postgres",
            "Port": 5432,
            "MaintenanceDB": "easi",
            "Username": "easi",
            "SSLMode": "prefer"
          }
        }
      }
