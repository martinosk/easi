services:
  postgres-e2e:
    image: postgres:17-alpine
    container_name: easi-postgres-e2e
    environment:
      POSTGRES_USER: easi
      POSTGRES_PASSWORD: easi
      POSTGRES_DB: easi
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easi"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - easi-e2e-network
    # No volumes - database resets on each run

  migrate-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    container_name: easi-migrate-e2e
    environment:
      DB_ADMIN_CONN_STRING: "host=postgres-e2e port=5432 user=easi password=easi dbname=easi sslmode=disable"
      EASI_APP_PASSWORD: localdev
      EASI_ADMIN_PASSWORD: localdev
    networks:
      - easi-e2e-network
    depends_on:
      postgres-e2e:
        condition: service_healthy

  backend-e2e:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        GO_BUILD_TAGS: devauth
    container_name: easi-backend-e2e
    environment:
      DB_CONN_STRING: "host=postgres-e2e port=5432 user=easi_app password=localdev dbname=easi sslmode=disable"
      AUTH_MODE: "bypass"
      PORT: 8080
      PLATFORM_ADMIN_API_KEY: localdev
      ALLOWED_ORIGINS: "http://localhost:3000,http://localhost:5173"
      FRONTEND_URL: "http://localhost:5173/"
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-105b52c2af25870943e36ded5a7ca51927715ca4bae962b9c72b9268b4ccb43a}
      AGENT_TOKEN_SECRET: easi-e2e-agent-token-secret-do-not-use-in-production
    ports:
      - "8081:8080"
    depends_on:
      postgres-e2e:
        condition: service_healthy
      migrate-e2e:
        condition: service_completed_successfully
    networks:
      - easi-e2e-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

networks:
  easi-e2e-network:
    driver: bridge
