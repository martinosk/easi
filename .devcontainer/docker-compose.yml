services:
  workspace:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-UTC}
    # Rootless podman: map host user (uid/gid 1000) to the container's node user
    # so bind-mounted workspace files are writable.
    userns_mode: keep-id
    command: ["sh", "-c", "socat TCP-LISTEN:5556,fork,reuseaddr TCP:dex:5556 & exec sleep infinity"]
    env_file:
      - .devcontainer/.env
    volumes:
      - .:/workspace:delegated
      - /tmp/.X11-unix:/tmp/.X11-unix
      - easi-claude-config:/home/node/.claude
      - easi-go-cache:/home/node/go
      - easi-npm-cache:/home/node/.npm
      - easi-frontend-node-modules:/workspace/frontend/node_modules
    environment:
      DISPLAY: ":0"
      INTEGRATION_TEST_DB_HOST: postgres
      DB_CONN_STRING: host=postgres port=5432 user=easi_app password=localdev dbname=easi sslmode=disable
      AUTH_MODE: ${AUTH_MODE:-local_oidc}
      PORT: 8080
      PLATFORM_ADMIN_API_KEY: ${PLATFORM_ADMIN_API_KEY:-localdev}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-easi-test-secret}
      OIDC_REDIRECT_URL: http://localhost:8080/api/v1/auth/callback
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:5173/
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-105b52c2af25870943e36ded5a7ca51927715ca4bae962b9c72b9268b4ccb43a}
      AGENT_TOKEN_SECRET: ${AGENT_TOKEN_SECRET:-easi-local-agent-token-secret-do-not-use-in-production}
    networks:
      - easi-network

volumes:
  easi-claude-config:
    name: easi-claude-config
  easi-go-cache:
    name: easi-go-cache
  easi-npm-cache:
    name: easi-npm-cache
  easi-frontend-node-modules:
    name: easi-frontend-node-modules
