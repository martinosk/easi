# Rootless podman: run containers standalone (not in a shared pod) so per-container
# userns_mode: keep-id is allowed. Ignored by Docker Compose.
x-podman:
  in_pod: false

services:
  workspace:
    build:
      context: .devcontainer
      dockerfile: Dockerfile
      args:
        TZ: ${TZ:-UTC}
    # Rootless podman: map host user (uid/gid 1000) to the container's node user
    # so bind-mounted workspace files are writable.
    userns_mode: keep-id
    command: sleep infinity
    env_file:
      - .devcontainer/.env
    volumes:
      - .:/workspace:delegated
      - /tmp/.X11-unix:/tmp/.X11-unix
      - easi-claude-config:/home/node/.claude
      - easi-go-cache:/home/node/go
      - easi-npm-cache:/home/node/.npm
      - easi-frontend-node-modules:/workspace/frontend/node_modules
    environment:
      DISPLAY: ":0"
      INTEGRATION_TEST_DB_HOST: postgres
      DB_CONN_STRING: host=postgres port=5432 user=easi_app password=localdev dbname=easi sslmode=disable
    networks:
      - easi-network
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  easi-claude-config:
    name: easi-claude-config
  easi-go-cache:
    name: easi-go-cache
  easi-npm-cache:
    name: easi-npm-cache
  easi-frontend-node-modules:
    name: easi-frontend-node-modules
